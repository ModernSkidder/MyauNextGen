plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
	// Must match FLK's Kotlin (1.13.8+kotlin.2.3.0) so our classes link against the
	// same stdlib the loader provides. The compose plugin version always equals the
	// Kotlin version.
	id 'org.jetbrains.kotlin.jvm' version '2.3.0'
	id 'org.jetbrains.kotlin.plugin.compose' version '2.3.0'
}

loom {
	runs {
		client {
			programArgs("--quickPlaySingleplayer", "New World")
			// Run with -PdumpTree to log the OneConfig tree structure on startup.
			if (project.hasProperty("dumpTree")) {
				vmArg("-Dmyau.oneconfig.dumpTree=true")
			}
			// Run with -PnoHuds to skip HUD Designer registration (bisecting aid).
			if (project.hasProperty("noHuds")) {
				vmArg("-Dmyau.oneconfig.noHuds=true")
			}
		}
	}
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'LocalLibs'
		url = uri("${projectDir}/libs-repo")
	}
	mavenCentral()
	maven {
		name = 'SpongePowered'
		url = 'https://repo.spongepowered.org/maven/'
	}
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	// --- OneConfig and its transitive dependencies ---
	maven {
		name = 'Polyfrost'
		url = 'https://repo.polyfrost.org/releases'
	}
	maven {
		name = 'PolyfrostSnapshots'
		url = 'https://repo.polyfrost.org/snapshots'
	}
	maven {
		name = 'Hypixel'
		url = 'https://repo.hypixel.net/repository/Hypixel/'
		content { includeGroupAndSubgroups('net.hypixel') }
	}
	maven {
		name = 'Bawnorton'
		url = 'https://maven.bawnorton.com/releases'
		content { includeGroup('com.github.bawnorton.mixinsquared') }
	}
	// Compose/Skiko artifacts live only in the Kotlin compose-dev redirector
	maven {
		name = 'ComposeDev'
		url = 'https://redirector.kotlinlang.org/maven/compose-dev'
		content { includeGroupAndSubgroups('org.jetbrains') }
	}
	maven {
		name = 'ModrinthMaven'
		url = 'https://api.modrinth.com/maven'
		content { includeGroup('maven.modrinth') }
	}
}

// OneConfig coordinates. Keep these in lockstep when upgrading; the JiJ list below
// mirrors upstream's own bundling rules (buildSrc/oneconfig-bootstrap.gradle.kts).
ext.oneconfig_mc = '1.21.4-fabric'
ext.oneconfig_version = '1.1.6'
ext.oneconfig_compose_bundle = '1.0.2+compose.1.12.0-alpha01'
ext.flk_version = '1.13.8+kotlin.2.3.0'

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// --- OneConfig: compile against the platform module (pulls the whole API graph) ---
	// OneConfig declares fabric-loader 0.19.3, which would win conflict resolution and
	// drag in a loader newer than this project targets (its Mixin service then fails to
	// load in the dev runtime). The loader and Fabric API always come from the game, so
	// exclude them here and keep the versions from gradle.properties authoritative.
	modImplementation("org.polyfrost.oneconfig:${oneconfig_mc}:${oneconfig_version}") {
		exclude group: 'net.fabricmc', module: 'fabric-loader'
		exclude group: 'net.fabricmc.fabric-api'
	}

	// fabric-language-kotlin is a DECLARED dependency, never nested: it supplies the
	// Kotlin stdlib/coroutines at runtime and nesting it duplicates those classes.
	// This mirrors upstream, which lists FLK in its JiJ exclusion set and declares
	// requires("fabric-language-kotlin") when publishing.
	modCompileOnly "net.fabricmc:fabric-language-kotlin:${flk_version}"
	modLocalRuntime "net.fabricmc:fabric-language-kotlin:${flk_version}"

	implementation "com.google.code.gson:gson:2.10.1"
	implementation "commons-io:commons-io:2.15.1"
	implementation "org.apache.commons:commons-lang3:3.17.0"
	implementation "org.apache.httpcomponents:httpclient:4.5.14"
	annotationProcessor "com.google.guava:guava:33.0.0-jre"
	annotationProcessor "net.fabricmc:tiny-remapper:0.10.4"
	annotationProcessor "net.fabricmc:tiny-mappings-parser:0.3.0+build.17"
}

// ---------------------------------------------------------------------------
// Jar-in-Jar: bundle OneConfig so the user does not install it separately.
//
// Every entry is non-transitive on purpose - the graph is pinned explicitly so a
// transitive bump cannot silently pull Kotlin or Fabric API into the jar.
//
// Deliberately NOT nested (provided at runtime by other means):
//   - fabric-loader / fabric-api        -> the game provides them
//   - fabric-language-kotlin            -> declared dependency (see above)
//   - org.jetbrains.kotlin[x] artifacts -> supplied by FLK
//   - compose / skiko / androidx        -> already shaded inside compose-bundle
//   - DevAuth                           -> dev-only tool
// ---------------------------------------------------------------------------
dependencies {
	// OneConfig platform module (Fabric mod id: oneconfigv1)
	include "org.polyfrost.oneconfig:${oneconfig_mc}:${oneconfig_version}"

	// OneConfig library modules (the actual UI lives in `internal` + `ui`)
	['commands', 'config', 'config-impl', 'events', 'hud',
	 'internal', 'notifications', 'poly-compose', 'ui', 'utils'].each { m ->
		include "org.polyfrost.oneconfig:${m}:${oneconfig_version}"
	}

	// Shaded Compose Multiplatform + Skiko runtime (Fabric mod id: compose-multiplatform)
	include "org.polyfrost.oneconfig:compose-bundle:${oneconfig_compose_bundle}"

	// Third-party runtime dependencies of OneConfig
	include 'com.electronwill.night-config:core:3.6.6'
	include 'com.electronwill.night-config:json:3.6.6'
	include 'com.electronwill.night-config:toml:3.6.6'
	include 'com.electronwill.night-config:yaml:3.6.6'
	include 'org.yaml:snakeyaml:1.31'
	include 'org.commonmark:commonmark:0.24.0'
	include 'org.polyfrost:isolated-lwjgl3-loader:0.3.0'
	include 'ca.weblite:java-objc-bridge:1.2'
	include 'com.github.bawnorton.mixinsquared:mixinsquared-common:0.3.7-beta.1'
	include 'net.hypixel:hypixel-data:0.2.0'
	include 'maven.modrinth:hypixel-mod-api:1.0.1+build.1+mc1.21'

	// Kyori Adventure (text pipeline used by OneConfig)
	['adventure-key', 'adventure-api', 'adventure-text-logger-slf4j',
	 'adventure-text-minimessage', 'adventure-text-serializer-plain',
	 'adventure-text-serializer-ansi', 'adventure-text-serializer-commons',
	 'adventure-text-serializer-gson', 'adventure-text-serializer-json'].each { m ->
		include "net.kyori:${m}:4.25.0"
	}
	include 'net.kyori:adventure-platform-api:4.4.1'
	include 'net.kyori:adventure-platform-fabric:6.3.0'
	include 'net.kyori:ansi:1.1.1'
	include 'net.kyori:examination-api:1.3.0'
	include 'net.kyori:examination-string:1.3.0'
	include 'net.kyori:option:1.1.0'
}

// Pin every nested dependency to exactly the requested artifact.
configurations.include {
	transitive = false
}

processResources {
	inputs.property "version", project.version
	inputs.property "modid", project.modid
	filesMatching("fabric.mod.json") {
		expand "version": project.version, "modid": project.modid
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 21
	it.options.compilerArgs += ["-Xmaxerrs", "2000", "-Xmaxwarns", "2000", "-AdisableTargetValidator=true"]
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
	// Must match the Java release so the mixed jar is consistent, and must run with
	// the jvm target the game uses.
	kotlinOptions.jvmTarget = "21"
}

// Kotlin and Java are compiled together. The Java directory is listed for Kotlin too so
// the Kotlin compiler can resolve symbols from the ~370 Java classes (it still only
// compiles the .kt files); without it every reference to laoqi123.* fails to resolve.
sourceSets.main {
	java { srcDirs += 'src/main/java' }
	kotlin { srcDirs = ['src/main/kotlin', 'src/main/java'] }
}

// src/main/java belongs to both source sets now, so every .java file is offered to the
// sources jar twice. Keeping the first copy is correct; they are the same file.
// Matched by type because withSourcesJar() registers the task after this block runs.
tasks.withType(Jar).configureEach {
	if (name == 'sourcesJar') {
		duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	}
}

// The compose compiler generates metadata referencing the runtime; both come from the
// same JetBrains line already on the compile classpath through OneConfig's POM.
dependencies {
	compileOnly "org.jetbrains.kotlin:kotlin-stdlib:2.3.0"
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
}
